services:
  web:
    image: ${IMAGE_REF:-linart-web}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linart_web
    restart: always
    ports:
      - "${LINART_PORT:-8080}:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/linart
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:${LINART_PORT:-8080}}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # 27 = первичный сайт аккаунта («LinArt Support AI») в портале консультанта.
      # Не секрет (id виден в <script>), поэтому дефолт здесь — чтобы деплой готовым
      # образом работал без правки .env на сервере.
      - AI_CONSULTANT_CLIENT_ID=${AI_CONSULTANT_CLIENT_ID:-27}
      - AI_CONSULTANT_API_URL=${AI_CONSULTANT_API_URL:-https://ai.crm-iot.com}
    depends_on:
      - db
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - linart_net

  db:
    image: postgres:15-alpine
    container_name: linart_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linart
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - linart_net

volumes:
  db_data:

networks:
  linart_net:
    driver: bridge
